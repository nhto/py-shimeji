name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Decode signing certificate
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' }}
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64)
          $path = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          echo "WINDOWS_SIGN_CERT_PATH=$path" >> $env:GITHUB_ENV

      - name: Build release artifacts
        env:
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          .\scripts\build-release.ps1 -Installer -Sign

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/py-shimeji-${{ steps.version.outputs.version }}.zip
            dist/py-shimeji-setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
